<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小琦的碎片库 · 个人知识收纳</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e8769f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="碎知识Kitty" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=13" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">小琦的碎片库</div>
        <button id="toggleSidebar" class="icon-btn" title="隐藏侧边栏">⟨</button>
      </div>
      <div id="sectionList" class="section-list"></div>
      <button id="addSectionBtn" class="add-section-btn">＋ 新增板块</button>
      <div class="sidebar-footer">
        <button id="exportBtn" class="footer-btn">⤓ 完整备份</button>
        <button id="exportTextBtn" class="footer-btn">📄 导出文本</button>
        <button id="importBtn" class="footer-btn">⤒ 导入</button>
        <button id="offlineBtn" class="footer-btn offline-btn">⬇️ 离线版</button>
        <button id="settingsBtn" class="footer-btn settings-btn">⚙️ AI 设置</button>
        <input type="file" id="importFile" accept=".json,.md,.txt,.markdown,application/json,text/markdown,text/plain" class="hidden" />
      </div>
    </aside>

    <div id="resizeHandle" class="resize-handle" title="拖动调节宽度"></div>

    <main id="main">
      <header id="mainHeader">
        <button id="showSidebar" class="icon-btn hidden" title="展开侧边栏">☰</button>
        <button id="homeBtn" class="icon-btn" title="返回首页">🏠</button>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input id="globalSearch" type="text" placeholder="搜索标题 / 标签…" autocomplete="off" />
          <div id="searchResults" class="search-results hidden"></div>
        </div>
        <div class="header-actions">
          <button id="addModuleBtn" class="ghost-btn">＋ 子模块</button>
          <button id="addRecordBtn" class="primary-btn">＋ 记录</button>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
    <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=13"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js?v=13').then(function(reg) {
          reg.addEventListener('updatefound', function() {
            var installing = reg.installing;
            installing.addEventListener('statechange', function() {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        }).catch(function(e) {
          console.log('SW registration failed:', e);
        });
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
